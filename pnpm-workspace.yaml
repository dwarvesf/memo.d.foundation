# Packages permitted to run install scripts (pnpm 11 build-approval flow).
# sharp compiles native bindings; the other toolchain packages ship prebuilt
# platform binaries via optionalDependencies and do not need their postinstall.
onlyBuiltDependencies:
  - sharp

# Packages whose install scripts are explicitly ignored — silently skipped,
# no ERR_PNPM_IGNORED_BUILDS. pnpm 11 hard-fails CI/Docker `pnpm install` on
# any package with a build script that is in neither `onlyBuiltDependencies`
# nor this list. All of these ship prebuilt binaries, so skipping their
# scripts is safe on the linux/amd64 build image (and matches the old pnpm 10
# default behaviour, which silently skipped them).
ignoredBuiltDependencies:
  - arconnect
  - arweave
  - bufferutil
  - core-js
  - esbuild
  - keccak
  - unrs-resolver
  - utf-8-validate

# Keep the conventional virtual-store layout so dependency type resolution
# (e.g. @types/react) and `pnpm run`'s deps status check stay stable.
virtualStoreDir: .pnpm

# pnpm 11's deps preflight, which `pnpm run <script>` runs before invoking the
# tool, exits non-zero on the ERR_PNPM_IGNORED_BUILDS notice above. The
# affected packages ship prebuilt binaries, so the preflight failure is
# spurious. Disable it so `pnpm run` invokes tools directly without
# re-validating the install layout on every run.
verifyDepsBeforeRun: false
