name: Publish to Cloudflare Pages

# Auto-publish vault content to Cloudflare Pages (project memo-d-foundation),
# replacing the retired Railway auto-build path. Mirrors the proven M4-02
# cutover build step-for-step; see docs/cf-migration/M4-02-PAGES-CUTOVER-RECORD.md.
#
# This is the only publish path. The reindex that used to live in the
# manual-only "Update submodules" workflow (dispatch.yml) and in the daily
# backup workflow (backup.yml) now runs here, so db/vault.parquet is always as
# fresh as the deploy. Both of those workflows are retired.
#
# The pipeline itself lives in scripts/build-and-deploy.sh, which is
# runner-agnostic: this workflow only provisions the toolchain and passes
# environment variables. Any machine with the same toolchain can run the same
# pipeline with no rewrite.
#
# GATED: inert (skipped, not red) until the repo variable PAGES_PUBLISH_ENABLED
# is set to 'true' and CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID exist.

on:
  push:
    branches:
      - main
    paths:
      - vault
      - db/**
      - src/**
      - lib/obsidian-compiler/**
      - scripts/**
      - functions/**
      - public/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - next.config.ts
      - Makefile
      - wrangler.toml
      - .github/workflows/publish-pages.yml
  workflow_dispatch:
    inputs:
      skip_reindex:
        description: 'Skip the DuckDB reindex (docs-only redeploy)'
        type: boolean
        default: false
  schedule:
    # Daily at 22:00 UTC (05:00 VN, after the VN workday's vault pushes).
    # This schedule is what keeps content flowing: the build below always
    # advances the vault submodule to latest origin/main (exactly what the
    # retired Railway Dockerfile did on every build) and reindexes it.
    - cron: '0 22 * * *'

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    if: vars.PAGES_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read-only on git: this job publishes to Cloudflare, it never pushes back.
    permissions:
      contents: read
    env:
      LANG: C.UTF-8
    steps:
      - name: Checkout contents repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Toolchain: Node 23, pnpm 11.6.0. No Elixir setup and no DuckDB CLI:
      # both compilers are TypeScript now and reach DuckDB through
      # @duckdb/node-api, so the runner needs nothing else.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: pnpm

      # Everything else is scripts/build-and-deploy.sh: vault -> deps ->
      # reindex -> compile -> build -> Pages -> R2 -> D1. Keep this step thin;
      # pipeline changes belong in the script, not here.
      - name: Reindex, build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAUSIBLE_API_TOKEN: ${{ secrets.PLAUSIBLE_API_TOKEN }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          GIT_FORCE_HTTPS: '1'
          SKIP_REINDEX: ${{ inputs.skip_reindex && '1' || '0' }}
        run: bash scripts/build-and-deploy.sh

      # This is the only publish path, so a silent failure means the site
      # serves stale content until someone notices by hand. Failure only:
      # the deploy runs on every push to main, so a success ping is noise.
      # Same action + webhook the retired backup.yml / dispatch.yml used.
      - name: Notify Discord on Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: '❌ Pages Publish Failed'
          description: |
            memo.d.foundation did not publish. The site is serving stale content until this is fixed.
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xff0000
