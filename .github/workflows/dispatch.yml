name: Update submodules

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-workflow
  cancel-in-progress: false

jobs:
  publish_job:
    runs-on: ubuntu-latest
    name: Pull and update submodules
    steps:
      - name: Checkout contents repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DWARVES_PAT }}
          submodules: recursive
          fetch-depth: 1

      - name: Install devbox
        uses: jetpack-io/devbox-install-action@v0.12.0
        with:
          enable-cache: true
          devbox-version: 0.14.2

      - name: Run AI generate summary script
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          devbox run -- pnpm run generate-summary

      - name: Export DB
        shell: bash
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          devbox run duckdb-export
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INFINITY_API_KEY: ${{ secrets.INFINITY_API_KEY }}
          INFINITY_OPENAI_BASE_URL: ${{ secrets.INFINITY_OPENAI_BASE_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          JINA_BASE_URL: ${{ secrets.JINA_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # db/vault.parquet is regenerated every run (~22-27MB) and is no longer
      # committed to git (157 stale commits, 2.3GB .git bloat). Publish it to
      # R2 instead, at both an immutable per-SHA key and the mutable "latest"
      # pointer consumers read; same bucket/key convention publish-pages.yml
      # already uses for its derived-object uploads.
      - name: Upload vault.parquet to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for prefix in "derived/${GITHUB_SHA}" "derived/latest"; do
            npx wrangler@4 r2 object put "memo-derived/${prefix}/db/vault.parquet" \
              --file db/vault.parquet --content-type application/octet-stream --remote
          done

      - name: Commit and push changes
        uses: ./.github/actions/git-commit-push
        with:
          commit-message: 'chore(ci): reindex'

      - name: Notify Discord on Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: '✅ Submodules Updated Successfully'
          description: 'All submodules have been updated and reindexed successfully'
          color: 0x00ff00

      - name: Notify Discord on Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: '❌ Submodule Update Failed'
          description: 'Failed to update submodules or generate summary. Please check the workflow logs.'
          color: 0xff0000
